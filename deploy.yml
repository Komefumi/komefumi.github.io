name: Deploy Landing Page

on:
  push:
    branches:
      - main # Triggers the automation every time you push to main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java (For ClojureScript compiler)
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Compile Production ClojureScript
        run: npx shadow-cljs release app

      - name: Deploy public folder to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: public # <-- This specifies that ONLY the contents of public/ go live
          branch: gh-pages # <-- It deploys them cleanly to an isolated branch
